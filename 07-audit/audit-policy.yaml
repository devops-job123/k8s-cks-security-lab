apiVersion: audit.k8s.io/v1
kind: Policy
rules:
# Log all requests at Metadata level
- level: Metadata
  resources:
  - group: ""
    resources: ["pods", "secrets", "configmaps"]
  namespaces: ["secure-app", "restricted"]

# Log exec/attach/portforward at Request level (sensitive!)
- level: Request
  resources:
  - group: ""
    resources: ["pods/exec", "pods/attach", "pods/portforward"]

# Log secrets at RequestResponse level (full body)
- level: RequestResponse
  resources:
  - group: ""
    resources: ["secrets"]
  namespaces: ["secure-app"]
